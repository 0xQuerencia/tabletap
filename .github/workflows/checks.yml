name: TableTap checks
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Each new PR revision supersedes earlier checks; don't generate failures
# and notification emails for obsolete in-progress commits.
concurrency:
  group: tabletap-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PortAudio
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - uses: oven-sh/setup-bun@v2
      - name: Unit tests
        run: python -m pytest -q
      - name: Build wheel
        run: python -m pip wheel --no-deps -w dist .
      - name: Verify wheel includes the terminal app
        run: |
          python - <<'PY'
          import glob
          import zipfile
          wheel = glob.glob("dist/tabletap*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              for name in ("tabletap/ui/index.tsx", "tabletap/ui/config-store.ts", "tabletap/ui/safety.ts", "tabletap/ui/themes.ts", "tabletap/ui/commands.ts",
                           "tabletap/ui/action-builder.ts", "tabletap/ui/package.json",
                           "tabletap/ui/bunfig.toml", "tabletap/default_config.yaml"):
                  assert name in archive.namelist(), f"Missing in wheel: {name}"
          print("Wheel includes bundled OpenTUI files")
          PY
      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv --system-site-packages /tmp/tabletap-wheelcheck
          /tmp/tabletap-wheelcheck/bin/pip install --no-deps dist/tabletap*.whl
          (cd /tmp && /tmp/tabletap-wheelcheck/bin/python -c "import tabletap; from pathlib import Path; p = Path(tabletap.__file__).parent / 'ui' / 'index.tsx'; assert p.is_file(), p; print('Installed wheel UI:', p)")
          (cd /tmp && /tmp/tabletap-wheelcheck/bin/tabletap --help)
          (cd /tmp && /tmp/tabletap-wheelcheck/bin/tabletap doctor)
      - name: Install bundled TUI from wheel
        run: /tmp/tabletap-wheelcheck/bin/tabletap setup
      - name: Smoke-test installed TUI (not checkout)
        env:
          TABLETAP_SMOKE_COMMAND: /tmp/tabletap-wheelcheck/bin/tabletap tui --demo
        run: python tests/smoke_tui.py
  tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install TUI dependencies
        run: cd tabletap/ui && bun install
      - name: Typecheck OpenTUI
        run: cd tabletap/ui && bunx tsc --noEmit
      - name: Test all TUI configuration, safety, theme and action-builder modules
        run: cd tabletap/ui && bun test
      - name: Launch/exit OpenTUI in a terminal
        run: python tests/smoke_tui.py

  fish-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Fish
        run: sudo apt-get update && sudo apt-get install -y fish
      - name: Verify shell-independent virtual environment
        run: |
          python -m venv .venv
          .venv/bin/python -c "import sys; assert sys.prefix != sys.base_prefix"
          .venv/bin/python -m pip --version
      - name: Verify Fish activation uses active environment
        run: |
          fish -c 'source .venv/bin/activate.fish; python -c "import sys; assert sys.prefix != sys.base_prefix"'

  python314:
    name: Python 3.14 compatibility (CachyOS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install PortAudio for PyAudio
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev
      - name: Install and validate on Python 3.14
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q tabletap
          python -m pytest -q
