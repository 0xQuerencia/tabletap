name: TableTap checks
on:
  pull_request:
  push:
    branches:
      - main
      - feat/terminal-first-tui

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PortAudio
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Build wheel
        run: python -m pip wheel --no-deps -w dist .
      - name: Verify wheel includes the terminal app
        run: |
          python - <<'PY'
          import glob
          import zipfile
          wheel = glob.glob("dist/tabletap*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              for name in ("tabletap/ui/index.tsx", "tabletap/ui/package.json",
                           "tabletap/ui/bunfig.toml", "tabletap/default_config.yaml"):
                  assert name in archive.namelist(), f"Missing in wheel: {name}"
          print("Wheel includes bundled OpenTUI files")
          PY
  tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install TUI dependencies
        run: cd tabletap/ui && bun install
      - name: Typecheck OpenTUI
        run: cd tabletap/ui && bunx tsc --noEmit
      - name: Launch/exit OpenTUI in a terminal
        run: python tests/smoke_tui.py
