[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tabletap"
version = "0.2.0"
description = "Turn your laptop table into a button pad using the built-in microphone"
requires-python = ">=3.10"
dependencies = [
    "pyaudio>=0.2.14",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[project.scripts]
tabletap = "tabletap.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.0"]

[tool.setuptools.package-data]
tabletap = ["default_config.yaml"]
