# tabletap configuration
# Copy to ~/.config/tabletap/config.yaml and customize

audio:
  device_index: null        # null = system default mic, or set device index
  sample_rate: 44100
  channels: 1               # mono - most laptop mics are mono
  chunk_size: 1024

detection:
  threshold_db: -30         # run `tabletap calibrate` to set this
  min_gap_ms: 150           # min ms between taps (debounce)
  rhythm_window_ms: 800     # ms window to count taps as a group
  long_press_ms: 500        # ms of sustained pressure to trigger long

calibration:
  duration_sec: 10
  noise_floor_margin_db: 6

# Tap pattern actions
# Types: exec (launch app), key (keyboard shortcut), script (run .sh file)
actions:
  single:
    type: exec
    value: "spotify"        # change to any app or command
  double:
    type: exec
    value: "xdg-open https://gmail.com"
  triple:
    type: exec
    value: "xdg-open https://youtube.com"
  long:
    type: key
    value: alt+tab

logging:
  level: INFO
